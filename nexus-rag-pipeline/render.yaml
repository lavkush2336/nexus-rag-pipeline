services:
  - type: web
    name: nexus-rag-pipeline
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: nexus-rag-documents
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: MAX_RAG_ROUNDS
        value: "3"
      - key: RETRIEVE_K
        value: "5"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
